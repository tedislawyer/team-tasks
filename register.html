<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация | TeamTasks</title>
  </head>
  <body>
    <header id="app-header"></header>

    <main class="container py-4">
      <div class="card shadow-sm page-card">
        <div class="card-body p-4">
          <h1 class="h3 mb-4">Регистрация</h1>

          <form id="register-form">
            <div class="mb-3">
              <label for="full-name" class="form-label">Име и фамилия</label>
              <input
                type="text"
                class="form-control"
                id="full-name"
                name="full-name"
                autocomplete="name"
                required
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Имейл</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                autocomplete="email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Парола</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
              <div class="form-text">Паролата трябва да е поне 6 знака.</div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Регистрация
            </button>
          </form>

          <p class="mt-3 mb-0 text-center">
            Имаш акаунт? <a href="/login.html">Влез</a>
          </p>
        </div>
      </div>
    </main>

    <script type="module" src="/src/pages/register.js"></script>
  </body>
</html>
