<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход | TeamTasks</title>
  </head>
  <body>
    <header id="app-header"></header>

    <main class="container py-4">
      <div class="card shadow-sm page-card">
        <div class="card-body p-4">
          <h1 class="h3 mb-4">Вход</h1>

          <form id="login-form">
            <div class="mb-3">
              <label for="email" class="form-label">Имейл</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                autocomplete="email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Парола</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary w-100">Вход</button>
          </form>

          <p class="mt-3 mb-0 text-center">
            Нямаш акаунт? <a href="/register.html">Регистрирай се</a>
          </p>
        </div>
      </div>
    </main>

    <script type="module" src="/src/pages/login.js"></script>
  </body>
</html>
